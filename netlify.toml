[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # The demo form posts to the OneView app; keep connect-src in step with APP_URL in tools/build.py
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https://onebank-sa-iota.vercel.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Old single-page anchors and removed pages
[[redirects]]
  from = "/investors"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
